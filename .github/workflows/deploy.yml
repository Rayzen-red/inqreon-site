# Деплой на GitHub Pages через GitHub Actions (Settings → Pages → Source: GitHub Actions).
# Если проект лежит в подпапке репозитория, укажите её в `path`.
# GITHUB_TOKEN не может сам включить Pages (нужно administration:write), поэтому
# источник «GitHub Actions» задаётся в настройках репозитория до первого успешного деплоя.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5
        with:
          path: .
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
