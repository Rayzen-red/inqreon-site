# Деплой на GitHub Pages через GitHub Actions (Settings → Pages → Source: GitHub Actions).
# Если проект лежит в подпапке репозитория, укажите её в `path`.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # На пустом репозитории Pages ещё не включён. enablement создаёт сайт
      # с источником GitHub Actions (build_type: workflow), если токен это позволяет.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: withastro/action@v5
        with:
          path: .
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
