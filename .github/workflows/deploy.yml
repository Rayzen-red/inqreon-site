# Деплой на GitHub Pages через GitHub Actions (Settings → Pages → Source: GitHub Actions).
# Если проект лежит в подпапке репозитория, укажите её в `path`.
# GITHUB_TOKEN не может сам включить Pages (нужно administration:write), поэтому
# источник «GitHub Actions» задаётся в настройках репозитория до первого успешного деплоя.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  # upload-artifact / download-artifact for the IndexNow sitemap.
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5
        with:
          path: .
          node-version: 22
      # IndexNow читает карту уже собранного сайта, а не пересобирает её.
      - name: Upload sitemap for IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: dist/sitemap*.xml
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # После успешного деплоя Pages. Google IndexNow не поддерживает — см. docs/indexing.md.
  # continue-on-error: неудачный ping не краснит деплой.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sitemap
          path: dist
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
